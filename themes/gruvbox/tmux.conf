# Gruvbox Dark Hard theme, sourced by tmux.conf
# Local layout (as in other themes) in the gruvbox palette
# (https://github.com/morhetz/gruvbox); orange accent matches kitty's active tab
set -g message-style 'bg=#3c3836,fg=#ebdbb2,fill=#3c3836'
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#7c6f64'
set -g mode-style 'bg=#d65d0e,fg=#ebdbb2'
# Status bar
set -g status-justify absolute-centre
set -g status-style 'bg=#1d2021,fg=#928374'
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#fabd2f],#[bg=#d65d0e]}#[fg=#1d2021,bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format ' #I:#W#{s/[*-]//:window_flags} '
set -g window-status-current-format '#[fg=#ebdbb2,bg=#3c3836,bold] #I:#W#{s/[*-]//:window_flags} '
set -g window-status-activity-style 'fg=#fabd2f'
set -g window-status-bell-style 'fg=#fb4934,bold'
set -g status-right-length 80
set -g status-right '#{?pane_in_mode,#[fg=#fabd2f]#{pane_mode} ,}#[fg=#928374]#{=40:pane_title}'

# vim: ft=tmux
