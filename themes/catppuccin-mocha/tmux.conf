# Catppuccin Mocha theme, sourced by tmux.conf
# Local centered window list, session left, pane title right, using Mocha colors.
# Border colors follow catppuccin/tmux; status background/layout are local.
# Source and exact differences: README.md
set -g message-style 'bg=#313244,fg=#94e2d5,fill=#313244'
set -g pane-border-style 'fg=#6c7086'
set -g pane-active-border-style 'fg=#b4befe'
set -g mode-style 'bg=#f5e0dc,fg=#1e1e2e'
# Status bar
set -g status-justify absolute-centre
set -g status-style 'bg=#181825,fg=#7f849c'
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#f9e2af],#[bg=#cba6f7]}#[fg=#11111b,bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format ' #I:#W#{s/[*-]//:window_flags} '
set -g window-status-current-format '#[fg=#cdd6f4,bg=#45475a,bold] #I:#W#{s/[*-]//:window_flags} '
set -g window-status-activity-style 'fg=#f9e2af'
set -g window-status-bell-style 'fg=#f38ba8,bold'
set -g status-right-length 80
set -g status-right '#{?pane_in_mode,#[fg=#f9e2af]#{pane_mode} ,}#[fg=#7f849c]#{=40:pane_title}'

# vim: ft=tmux
