# Sonokai colors, imported by alacritty.toml
# From https://github.com/alacritty/alacritty-theme/blob/ab88d5a80d676b5dc6157e91aba8067f2078dc94/themes/sonokai.toml (Apache-2.0)
# ANSI mapping matches sonokai's own terminal colors (colors/sonokai.vim)

# sonokai.toml: Sonokai color scheme for Alacritty.

[colors.primary]
foreground = "#e2e2e3"
background = "#2c2e34"

[colors.normal]
black = "#181819"
red = "#fc5d7c"
green = "#9ed072"
yellow = "#e7c664"
blue = "#76cce0"
magenta = "#b39df3"
cyan = "#f39660"
white = "#e2e2e3"

[colors.bright]
black = "#7f8490"
red = "#fc5d7c"
green = "#9ed072"
yellow = "#e7c664"
blue = "#76cce0"
magenta = "#b39df3"
cyan = "#f39660"
white = "#e2e2e3"

[colors.cursor]
text = "#2c2e34"
cursor = "#e2e2e3"

[colors.selection]
text = "CellForeground"
background = "#414550"
