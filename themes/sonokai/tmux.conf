# Sonokai theme, sourced by tmux.conf
# Local layout (as in other themes); colors follow the author's tmuxline config
# (https://github.com/sainnhe/dotfiles/blob/67f2e6a53d7577e62cfa25fdae2362d9de66fd2d/.tmux/tmuxline/sonokai.tmux.conf)
set -g message-style 'bg=#414550,fg=#e2e2e3,fill=#414550'
set -g pane-border-style 'fg=#414550'
set -g pane-active-border-style 'fg=#85d3f2'
set -g mode-style 'bg=#414550,fg=#e2e2e3'
# Status bar
set -g status-justify absolute-centre
set -g status-style 'bg=#33353f,fg=#7f8490'
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#e7c664],#[bg=#85d3f2]}#[fg=#2c2e34,bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format ' #I:#W#{s/[*-]//:window_flags} '
set -g window-status-current-format '#[fg=#e2e2e3,bg=#414550,bold] #I:#W#{s/[*-]//:window_flags} '
set -g window-status-activity-style 'fg=#e7c664'
set -g window-status-bell-style 'fg=#fc5d7c,bold'
set -g status-right-length 80
set -g status-right '#{?pane_in_mode,#[fg=#e7c664]#{pane_mode} ,}#[fg=#7f8490]#{=40:pane_title}'

# vim: ft=tmux
