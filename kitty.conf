cursor_blink_interval 0
cursor_shape block
enable_audio_bell no
font_family family="Iosevka" style="Medium"
font_size 12.0
inactive_text_alpha 0.7
initial_window_height 40c
initial_window_width 120c
scrollback_lines 1000000
# Shell integration would otherwise switch to a bar cursor at the prompt
#shell_integration no-cursor
# Drop trailing spaces when copying, except from rectangle selections
strip_trailing_spaces smart
tab_activity_symbol "● "
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_title_max_length 32
tab_title_template "  {bell_symbol}{activity_symbol}{title}  "
update_check_interval 0
window_padding_width 1 2

# New tabs, panes and OS windows start in the current directory
map kitty_mod+t new_tab_with_cwd
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_os_window_with_cwd

map ctrl+page_up previous_tab
map ctrl+page_down next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Open links with Ctrl+click only; a plain click just selects
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left click ungrabbed mouse_handle_click link
mouse_map ctrl+left press ungrabbed discard_event

# Dracula
foreground #f8f8f2
background #282a36
selection_foreground #ffffff
selection_background #44475a
url_color #8be9fd
cursor #f8f8f2
cursor_text_color background
color0  #21222c
color8  #6272a4
color1  #ff5555
color9  #ff6e6e
color2  #50fa7b
color10 #69ff94
color3  #f1fa8c
color11 #ffffa5
color4  #bd93f9
color12 #d6acff
color5  #ff79c6
color13 #ff92df
color6  #8be9fd
color14 #a4ffff
color7  #f8f8f2
color15 #ffffff
tab_bar_background #2d303f
active_tab_foreground #f8f8f2
active_tab_background #373a48
active_tab_font_style normal
inactive_tab_foreground #6272a4
inactive_tab_background #2d303f
inactive_tab_font_style normal
active_border_color #6272a4
inactive_border_color #44475a
bell_border_color #ffb86c

# vim: ft=kitty
