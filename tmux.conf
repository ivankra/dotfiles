# Shrink a window only for clients actually looking at it, not all attached
set -g aggressive-resize on
# Pass through escape sequences (e.g. images to wezterm)
set -g allow-passthrough on
# Number windows and panes from 1, and close gaps when a window closes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
# Keep status-line messages up for 2s instead of 0.75s
set -g display-time 2000
# Pass extended keys like Ctrl+Shift+x or Ctrl+Enter (for nvim etc)
set -g extended-keys on
# Tell programs when pane loses/gains focus (for vim's autoread)
set -g focus-events on
# Scrollback lines kept per pane, so memory grows with pane count
set -g history-limit 1000000
# vi keys for navigating and selecting in copy mode
set -g mode-keys vi
# Highlight windows with new output in the status bar
set -g monitor-activity on
# Enable mouse to select panes/windows, drag borders, scroll, select etc
set -g mouse on
# Let programs copy to clipboard (OSC 52)
set -g set-clipboard on
# Title to forward to the terminal app
set -g set-titles on
set -g set-titles-string '[#h:#S] #T #{session_alerts}'
# Flag activity in the status bar only, without interrupting with a message
set -g visual-activity off

# Screen convention: C-a prefix, C-a C-a toggles windows, C-a a sends C-a
set -g prefix C-a
bind a send-prefix       # C-a a sends C-a
bind C-a last-window     # C-a C-a toggles between the last two windows
# Default tmux convention as backup: C-b prefix, C-b C-b sends C-b
set -g prefix2 C-b
bind b send-prefix -2    # C-b b sends C-b
bind C-b send-prefix -2  # C-b C-b sends C-b

# Start new windows/splits in the current directory
# Mnemonic aliases for splits: | split left/right, - split top/bottom
bind c new-window -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'  # | w/o Shift
bind '"' split-window -v -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'

# Bind usual tab keys in case the terminal didn't grab them already
bind -n C-PPage previous-window
bind -n C-NPage next-window
bind -n C-S-t new-window -c '#{pane_current_path}'

# Alt-N jumps to window N
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux.conf'
bind '?' display-popup -w 80% -h 80% -E 'tmux list-keys -N | less'  # show help in popup

# Vim-style copy mode: v selects, Ctrl+v toggles rectangle, y copies and exits
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Stay in copy mode on mouse release
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Mouse wheel in less/man/git log (alternate screen without mouse support)
# sends arrow keys, as terminals do outside tmux; programs that handle the
# mouse still get wheel events, and a plain shell still enters copy mode
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
  'send -M' "if -F '#{alternate_on}' 'send -N 3 Up' 'copy-mode -e'"
bind -n WheelDownPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
  'send -M' "if -F '#{alternate_on}' 'send -N 3 Down' 'send -M'"

# Dracula theme
set -g message-style 'bg=#44475a,fg=#f8f8f2,fill=#44475a'
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#6272a4'
set -g mode-style 'bg=#f8f8f2,fg=#282a36'
# Status bar
set -g status-justify absolute-centre
set -g status-style 'bg=#282a36,fg=#6272a4'
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#f1fa8c],#[bg=#bd93f9]}#[fg=#282a36,bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format ' #I:#W#{s/[*-]//:window_flags} '
set -g window-status-current-format '#[fg=#f8f8f2,bg=#44475a,bold] #I:#W#{s/[*-]//:window_flags} '
set -g window-status-activity-style 'fg=#f1fa8c'
set -g window-status-bell-style 'fg=#ff5555,bold'
set -g status-right-length 80
set -g status-right '#{?pane_in_mode,#[fg=#f1fa8c]#{pane_mode} ,}#[fg=#6272a4]#{=40:pane_title}'

# Fallback to screen-256color if tmux-256color unavailable (e.g. stock macOS)
if-shell \
  'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'

# vim: ft=tmux
